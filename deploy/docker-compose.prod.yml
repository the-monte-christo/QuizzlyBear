# Produktionsstapel quizzlybear. Start: ./deploy.sh
# Die App hört nur auf 127.0.0.1 – nach außen geht ausschließlich nginx.
services:
  app:
    image: ${APP_IMAGE:-quizzlybear:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      PUBLIC_URL: https://quizzlybear.blanke.nrw
      DATA_DIR: /data
    ports:
      - '127.0.0.1:${APP_PORT:-3070}:3000'
    volumes:
      - ./daten:/data
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # etwas mehr als die üblichen 256m: Beim Quiz-Upload liegen ZIP und Bilder kurz im Speicher
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
